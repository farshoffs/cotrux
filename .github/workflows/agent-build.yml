name: Build Cotrux Desktop Agent

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apps/agent/**"
      - "package.json"
      - ".github/workflows/agent-build.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate Hyper-V helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "apps/agent/hyperv-manager.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - run: npm run dist:agent
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: cotrux-${{ runner.os }}
          path: release/**
          if-no-files-found: error

  publish-windows:
    name: Publish latest Windows installer
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cotrux-Windows
          path: windows-build
      - name: Prepare stable installer name
        run: |
          mkdir -p publish
          installer="$(find windows-build -type f -iname '*Setup*.exe' | head -n 1)"
          if [ -z "$installer" ]; then
            echo "Windows installer not found"
            exit 1
          fi
          cp "$installer" publish/Cotrux-Setup.exe
      - name: Publish desktop-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create desktop-latest publish/Cotrux-Setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cotrux Desktop — Latest" \
            --notes "Latest Windows installer built from the main branch. This release is replaced automatically by newer successful desktop builds."
